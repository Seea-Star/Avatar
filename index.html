<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Franchise Shrine - Cosmic-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 40px 15px;
      font-family: 'Quicksand', sans-serif;
      color: #111111;
      display: flex;
      justify-content: center;
      position: relative;
      background: linear-gradient(to bottom, #ded2b9 0%, #cbb998 50%, #b8a37f 100%);
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(45, 30, 15, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 30, 15, 0.08) 1px, transparent 1px);
      background-size: 25px 25px;
      pointer-events: none;
      z-index: 0;
    }

    .site-wrapper {
      max-width: 950px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: relative;
      z-index: 1;
    }

    /* LOGO PRINCIPALE IN ALTO */
    .top-banner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }

    .top-banner img.logo-img {
      max-width: 440px;
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(3px 3px 0px #111111);
      transition: transform 0.3s ease;
    }

    .top-banner img.logo-img:hover {
      transform: scale(1.03);
    }

    /* HEADER SUPERIORE: PLAYER + 3 COPERTINE LIBERE CLICCABILI */
    .header-top-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: center;
    }

    @media screen and (min-width: 768px) {
      .header-top-grid {
        grid-template-columns: 320px 1fr;
        gap: 25px;
      }
    }

    /* PLAYER MUSICALE */
    .cosmic-player {
      background: url('https://raw.githubusercontent.com/Seea-Star/Howl/refs/heads/main/c14b6fdbee2490ed3ff5a726d32d749f.gif') center/cover no-repeat;
      border: 3px solid #111111;
      border-radius: 14px;
      box-shadow: 5px 5px 0px #111111;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .cosmic-player:hover {
      transform: translateY(-5px) rotate(1deg);
      box-shadow: 8px 8px 0px #111111;
    }

    .cosmic-player-inner {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .player-screen {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-align: center;
      border-bottom: 1px dashed rgba(255,255,255,0.4);
      padding-bottom: 6px;
      width: 100%;
      text-shadow: 1px 1px 3px #000;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .player-btn {
      background: #ffffff;
      color: #111111;
      border: 2px solid #111;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 2px 2px 0px #111;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .player-btn:hover {
      transform: scale(1.12);
      background: #fcf8ee;
    }

    /* CONTENITORE COPERTINE LIBERE (SENZA BOX BIANCO DI GRUPPO) */
    .series-covers-flex {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .cover-link {
